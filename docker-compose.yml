# LessonForge — full local stack.
#
#   cp .env.example .env
#   docker compose up --build
#
# Default `up` starts: postgres (pgvector), redis, minio, api, worker, web.
# Observability (prometheus, grafana) is opt-in:
#   docker compose --profile observability up

name: lesson-forge

services:
  # ── PostgreSQL with the pgvector extension ──────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: ${POSTGRES_DB:-lessonforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-lessonforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis (cache, ARQ queue, event streams) ─────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # ── One-shot: create the bucket, then exit ──────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lesson-forge}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/\"$$S3_BUCKET\";
      echo 'bucket ready: '\"$$S3_BUCKET\";
      "
    restart: "no"

  # ── FastAPI application ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      RUN_MIGRATIONS: "1"   # api owns schema migrations
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      # Curriculum docs for RAG ingestion (`make ingest`); read-only.
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # Reach a host-run Ollama (`ollama serve`) from the container on Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── ARQ background worker (runs the LangGraph pipeline) ─────
  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    environment:
      RUN_MIGRATIONS: "0"   # worker never migrates
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
      # Curriculum docs for RAG ingestion (`make ingest`); read-only.
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # Reach a host-run Ollama (`ollama serve`) from the container on Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Next.js frontend ────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    command: ["npm", "run", "dev"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules   # keep container's installed modules
    depends_on:
      - api
    restart: unless-stopped

  # ── Observability (opt-in: --profile observability) ─────────
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes:
      - ./infra/docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  miniodata:
  grafanadata:
